# EXAMPLE WORKFLOW — not used by this repository.
#
# This file demonstrates how a downstream Rust project would run cargo-witness
# on pull requests. Copy it into your own repository's .github/workflows/
# directory and replace `uses: ./` with a published reference such as
# `uses: user/cargo-witness@v1`.
#
# In CI mode the action inspects packages newly added to Cargo.lock by
# comparing against the previous commit (`git diff HEAD~1`), so the checkout
# must fetch at least two commits (`fetch-depth: 2`).

name: cargo-witness (example)

on:
  pull_request:
    paths:
      - Cargo.lock

jobs:
  supply-chain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed for the `git diff HEAD~1` comparison in CI mode.
          fetch-depth: 2

      - name: Run cargo-witness
        id: witness
        uses: ./
        with:
          cargo-lock: Cargo.lock
          github-token: ${{ github.token }}

      - name: Report result
        run: echo "Suspicious packages: ${{ steps.witness.outputs.suspicious-count }}"
