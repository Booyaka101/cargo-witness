name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# One run per branch. A second push supersedes the first instead of queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.22.2', '24.15.0', '26']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Run tests
        run: npm test

      - name: Rebuild Action bundle
        run: npm run build:action

      - name: Check committed bundle is up to date
        # Hard failure, not a warning. This was warning-only on the assumption that
        # ncc output varies across platforms/versions — measured 2026-07-27 and it
        # does not: a Linux build (docker node:24, ncc 0.44.1 from the lockfile) is
        # byte-identical to the bundle committed from Windows, and this step has
        # passed on every run. dist/action.js is what the Action actually executes,
        # so a stale one means the published behaviour differs from the source; that
        # deserves to fail rather than scroll past in the log.
        run: |
          git diff --exit-code -- dist/ \
            || (echo "::error::dist/ is stale — run 'npm run build:action' and commit dist/action.js" && exit 1)
