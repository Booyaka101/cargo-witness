name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Rebuild Action bundle
        run: npm run build:action

      - name: Check committed bundle is up to date
        # Warning only: ncc output can differ slightly across platforms/versions,
        # and the bundle is native-free so there is no platform binary to drift.
        run: git diff --exit-code dist/ || echo "::warning::dist/ differs from a fresh local build; run 'npm run build:action' and commit if intended."
