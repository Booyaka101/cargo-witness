name: Feature request
description: Suggest something cargo-witness should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Downloads published `.crate` artifacts from `static.crates.io` and the matching git source, then diffs them locally. It executes nothing from either side.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. What got in your way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
    validations:
      required: false
