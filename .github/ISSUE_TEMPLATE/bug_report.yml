name: Bug report
description: Something didn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, and what came back.
      placeholder: |
        $ cargo-witness serde@1.0.210
        Error: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: cargo-witness version
      description: Output of `cargo-witness --version`
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Node version and OS
      description: Output of `node --version`, plus your OS.
      placeholder: v22.18.0 on Ubuntu 24.04
    validations:
      required: true

  - type: textarea
    id: crate
    attributes:
      label: Which crate and version
      description: The exact `name@version` you audited. It lets us reproduce against the same published artifact.
